name: monitor-btc

on:
  schedule:
    - cron: "*/15 * * * *"   # ogni 15 minuti (l'orario reale puo' avere ritardi)
  workflow_dispatch: {}       # permette anche l'avvio manuale dal sito

permissions:
  contents: write             # serve per risalvare lo stato nel repository

jobs:
  controlla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa librerie
        run: pip install -r requirements.txt

      - name: Notifica di prova (solo avvio manuale)
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "from notifica import invia; invia('✅ Test dalla cloud: il monitor gira online, senza il tuo PC.')"

      - name: Esegui il monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Salva lo stato aggiornato
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add stato.json notizie_viste.json
          git commit -m "aggiorna stato [skip ci]" || echo "niente da salvare"
          git push
